services:
  sing-box:
    build:
      context: .
      # 构建时内置的默认内核（稳定版），一般不用动：
      # args:
      #   BAKED_SINGBOX_VERSION: "v1.14.3"
    image: sing-box-sub:latest
    container_name: sing-box-sub
    restart: unless-stopped
    # 默认 host 网络；macvlan 备选见下面注释 + 文件底部 networks 段
    network_mode: host
    # macvlan 时：删掉/注释上面 network_mode 一行，取消下面 6 行注释
    # （ipv4_address 换成 LAN 内空闲 IP；macvlan 没有 docker 内嵌 DNS，必须显式配 dns）
    # networks:
    #   macvlan_net:
    #     ipv4_address: 192.168.1.200
    # dns:
    #   - 192.168.1.36
    #   - 223.5.5.5
    # TUN 模式必需：创建 tun 接口、配地址/路由要 NET_ADMIN；
    # 把宿主 /dev/net/tun 映射进来（宿主没有就先 modprobe tun）。
    # 不用 TUN 可删掉这两项。
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # host 模式下端口由订阅下发的完整配置的 inbounds 决定
    # 如需桥接模式，改用 ports 映射并保证 inbounds listen 在 0.0.0.0
    # ports:
    #   - "8080:8080"   # 管理面板
    #   - "7890:7890"   # mixed 入站（示例）
    environment:
      MANAGER_PORT: "8080"
      # MANAGER_TOKEN: "change-me"   # 生产环境务必设置
      # 内核版本：不填=镜像内置稳定版；填版本号则启动时自动下载，无需重建镜像
      # SINGBOX_VERSION: "v1.15.0-alpha.12"
      # SINGBOX_VERSION: "latest"   # 最新稳定版
      # GitHub 代理：国内直连 Release 吃力时填，如 https://ghproxy.com/
      # （构建时预装不受影响，只作用于运行时按需下载）
      # GITHUB_PROXY: "https://ghproxy.com/"
      # TUN 抢路由导致内网 DNS 被吞时，把网段摘出去（多个逗号分隔）：
      TUN_EXCLUDE: "192.168.1.0/24"
      AUTO_UPDATE_INTERVAL: "6h"     # 定时拉取订阅并热重载；0 关闭
      UPDATE_ON_START: "true"
      TZ: "Asia/Shanghai"
    volumes:
      # 整个目录挂载：避免单文件 bind 在宿主文件不存在时被 docker 建成目录导致挂载失败；
      # 容器生成的 config.json / config.json.tmp 会落到 ./config 下，方便排障
      - ./config:/etc/sing-box
      - sing-box-cache:/var/cache/sing-box-subs
      - sing-box-kernel:/opt/sing-box/versions   # 已下载内核缓存，切换版本秒切、重建不重复下载
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sing-box-cache:
  sing-box-kernel:

# macvlan 备选网络：容器拿独立 LAN IP + 独立 netns，TUN 抢路由只影响容器内部。
# 启用步骤：
#   1. 查宿主上网网卡：ip route show default（取 dev 后面的名字，如 eth0）
#   2. 下面 parent / subnet / gateway 按 LAN 实际填写，
#      上面 service 里 ipv4_address 填一个 LAN 内空闲 IP
#   3. 注释掉 service 的 network_mode: host，取消 service 里 networks/dns 注释
# 注意：
#   - macvlan 下宿主机直连不通容器 IP（内核隔离设计），用 LAN 内其他设备打开面板
#    （http://192.168.1.200:8088），或在宿主建 macvlan-shim 子接口绕行
#   - cap_add NET_ADMIN + /dev/net/tun 照样保留（TUN 建接口用）
#   - TUN_EXCLUDE 建议保留，LAN 流量别进 TUN
# networks:
#   macvlan_net:
#     driver: macvlan
#     driver_opts:
#       parent: eth0
#     ipam:
#       config:
#         - subnet: 192.168.1.0/24
#           gateway: 192.168.1.1
