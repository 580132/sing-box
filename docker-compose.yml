services:
  sing-box:
    build: .
    image: sing-box-sub:latest
    container_name: sing-box-sub
    restart: unless-stopped
    network_mode: host
    # host 模式下端口由订阅下发的完整配置的 inbounds 决定
    # 如需桥接模式，改用 ports 映射并保证 inbounds listen 在 0.0.0.0
    # ports:
    #   - "8080:8080"   # 管理面板
    #   - "7890:7890"   # mixed 入站（示例）
    environment:
      MANAGER_PORT: "8080"
      # MANAGER_TOKEN: "change-me"   # 生产环境务必设置
      AUTO_UPDATE_INTERVAL: "6h"     # 定时拉取订阅并热重载；0 关闭
      UPDATE_ON_START: "true"
      TZ: "Asia/Shanghai"
    volumes:
      - ./config/subscriptions.json:/etc/sing-box/subscriptions.json
      - sing-box-cache:/var/cache/sing-box-subs
      # sing-box 运行时生成的 config.json 也落在这里，方便排障：
      - ./data/config.json:/etc/sing-box/config.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sing-box-cache:
