services:
  sing-box:
    build:
      context: .
      # 构建时内置的默认内核（稳定版），一般不用动：
      # args:
      #   BAKED_SINGBOX_VERSION: "v1.14.3"
    image: sing-box-sub:latest
    container_name: sing-box-sub
    restart: unless-stopped
    network_mode: host
    # TUN 模式必需：创建 tun 接口、配地址/路由要 NET_ADMIN；
    # 把宿主 /dev/net/tun 映射进来（宿主没有就先 modprobe tun）。
    # 不用 TUN 可删掉这两项。
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # host 模式下端口由订阅下发的完整配置的 inbounds 决定
    # 如需桥接模式，改用 ports 映射并保证 inbounds listen 在 0.0.0.0
    # ports:
    #   - "8080:8080"   # 管理面板
    #   - "7890:7890"   # mixed 入站（示例）
    environment:
      MANAGER_PORT: "8080"
      # MANAGER_TOKEN: "change-me"   # 生产环境务必设置
      # 内核版本（和面板协同，规则统一）：
      # compose 在这里写死版本即定下限：面板只能升级到更新版本，低版本拒绝切换；
      # 启动时取 max(compose, 面板钉住, 内置) 运行，本地有更新版默认不降级下载。
      # 彻底由面板接管：注释掉 SINGBOX_VERSION。
      # SINGBOX_VERSION: "v1.14.3"
      # ALLOW_KERNEL_DOWNGRADE: "1"   # 强制按低版本降级（默认不降）
      # GitHub 代理（镜像站不稳时优先用 SOCKS5）：
      # SOCKS5_PROXY: "socks5://user:pass@192.168.1.2:1080"
      # 或 socks5h://host:1080（域名由代理解析）；设了它就忽略 GITHUB_PROXY 镜像
      # SOCKS5_PROXY: "socks5h://127.0.0.1:1080"
      # 订阅拉取也走该代理（默认不走，订阅通常直连可达）：
      # SUBS_USE_PROXY: "true"
      # 备用镜像（没 SOCKS5 时才用）：
      # GITHUB_PROXY: "https://ghproxy.com/"
      # TUN 抢路由导致内网 DNS 被吞时，把网段摘出去（多个逗号分隔）：
      TUN_EXCLUDE: "192.168.1.0/24"
      AUTO_UPDATE_INTERVAL: "6h"     # 定时拉取订阅并热重载；0 关闭
      UPDATE_ON_START: "true"
      TZ: "Asia/Shanghai"
    volumes:
      # 整个目录挂载：避免单文件 bind 在宿主文件不存在时被 docker 建成目录导致挂载失败；
      # 容器生成的 config.json / config.json.tmp 会落到 ./config 下，方便排障
      - ./config:/etc/sing-box
      - sing-box-cache:/var/cache/sing-box-subs
      - sing-box-kernel:/opt/sing-box/versions   # 已下载内核缓存，切换版本秒切、重建不重复下载
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sing-box-cache:
  sing-box-kernel:
