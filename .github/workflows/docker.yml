name: docker-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check
        run: python3 -m py_compile manager/manager.py

      - name: Web UI syntax check
        run: |
          python3 - <<'PY'
          import re
          src = open('manager/manager.py', encoding='utf-8').read()
          i = src.index('UI_HTML = """') + len('UI_HTML = """')
          html = src[i:src.index('"""', i)]
          js = html[html.index('<script>') + 8: html.index('</script>')]
          open('/tmp/ui.js', 'w', encoding='utf-8').write(js)
          # Python 非 raw 字符串里的 \n 会变成真换行，导致 JS 字符串跨行报错
          for ln, line in enumerate(js.splitlines(), 1):
              q = even = 0
              k = 0
              while k < len(line):
                  if line[k] == '\\':
                      k += 2
                      continue
                  if line[k] == "'":
                      q += 1
                  k += 1
              if q % 2 == 1 and not line.strip().startswith('//'):
                  raise SystemExit(f'line {ln}: unclosed JS string (literal newline?): {line.strip()[:120]}')
          # 重复 id 会导致 getElementById 只命中第一个，后面的按钮点了没反应
          import collections
          ids = re.findall(r'id="([^"]+)"', html)
          dup = [i for i, c in collections.Counter(ids).items() if c > 1]
          if dup:
              raise SystemExit(f'duplicate element id(s): {dup}')
          # 每个按钮都要有事件绑定，否则是死按钮
          for b in re.findall(r'<button[^>]*id="([^"]+)"', html):
              if not re.search(rf'\b{b}\.onclick\s*=', js) and not re.search(rf"getElementById\('{b}'\)\.addEventListener", js):
                  raise SystemExit(f'button without handler: {b}')
          PY
          node --check /tmp/ui.js && echo UI_JS_OK

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
